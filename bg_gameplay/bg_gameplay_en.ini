; bg_gameplay.ini -- settings of bg_gameplay.dll (PES 2021, exe 1.01)
; Read when the game starts and again before every match: a change applies from the next match.
; Any value can be konami (= as in the original game, unchanged).
; If this file is missing, the DLL creates it with these values.

[movement]
ai_top_speed = 35           ; The top speed at which players without the cursor run (their fastest movement level).
                            ; Applies to ALL players run by the computer - on both teams (your team-mates without
                            ; the cursor too), in defence and in attack.
                            ; Most visible in defence: chasing, pressing, tracking back. Konami 28.
                            ; At 6 the defence hardly chases you; at 35 it presses all over the pitch.

[defense]

profile = fair              ; <<< CHANGE THE PROFILE HERE. Write one of these four words:
                            ;     light  = small correction: the defender stays the quickest and "peeks" the most
                            ;              (the hardest for you of the three)
                            ;     fair   = in between (default)
                            ;     strong = strong correction: the defender reacts the slowest, like a human
                            ;              (the easiest for you of the three)
                            ;     custom = your own values from the [profile_custom] section below
                            ; Example: profile = strong
                            ; The numbers of each profile are in its own section below - you can change them.
                            ; Only the section of the chosen profile is used; the others are ignored.

; ------------------------------------------------------------------------------------------------
; What the five numbers mean (the same in every profile):
;   decide - how much of your touch (0..1) must have passed before the defender can "read" your new
;            direction from the stick when deciding whether and where to tackle / slide.
;            0 = clairvoyant, 1 = sees only the real ball. Konami 0.7 (+ two cases with no check).
;   foot   - the same for the direction of the foot during the tackle. Konami almost always 0.
;   angle  - the same for your body angle, which the AI uses to pick the tackle (0..0.99). Konami 0.5.
;   press  - the same for the direction the press thinks you are heading. Konami 0.25.
;   react  - every how many frames (54 per second) the defender facing you (1 v 1 and jockeying)
;            decides again where to stand. Konami 1-2; 8 = up to 130 ms; a human ~200-250 ms (11-14).
; Bigger numbers = the defender "peeks" less and reacts slower = easier for you.
; ------------------------------------------------------------------------------------------------

[profile_light]
decide = 0.8
foot = 0.8
angle = 0.7
press = 0.4
react = 4

[profile_fair]
decide = 0.85
foot = 0.85
angle = 0.8
press = 0.6
react = 8

[profile_strong]
decide = 1
foot = 1
angle = 0.95
press = 0.9
react = 12

[profile_custom]            ; used only with profile = custom
decide = 0.85
foot = 0.85
angle = 0.8
press = 0.6
react = 8

[press]
; Which AI defender goes to PRESS the ball carrier. Applies only when the AI is on Professional or higher.
; Distances are in metres from the defender to the ball carrier; bigger = presses from further away. The
; defender must be between the ball carrier and his own goal. The special cases (chasing the score,
; Gegenpress, Tight Marking, derby, attacking mode, Legend) stay as in the game - there the press already
; starts from further away.
press_radius_normal = 9     ; The MAIN radius in normal play. The defender goes to press only if he is closer.
                            ; Konami 6. The main control for "pressing all over the pitch".
press_radius_far = 12       ; The FAR radius in normal play - an upper limit checked before the main one. Konami 10.
                            ; It must be at least press_radius_normal, otherwise it cuts the main one.
                            ; In the game the same number is also the bonus for a fast defender on Legend (+10 m).
sandwich_distance = 2.0     ; How many metres from you the second defender stands in a sandwich (double press).
                            ; Konami 1.5. Smaller = tighter (more collisions); bigger = leaves room to get out.

[slides]
slide = fix                 ; fix = removes the slide-tackle boost when the AI is losing (+1 "chasing the score"
                            ; and +1 "attack level 4" to the slide aggression). konami = the boost stays.
slidemax = 2                ; Cap of the slide aggression L (0..3). Konami 3. L decides from how far
                            ; (4 + 0.8*L m), how inaccurate an angle / timing and how much collision risk a
                            ; slide accepts; at 3 it skips the "another opponent nearby" check. Below 3 the AI
                            ; does not slide inside its own penalty area.

[injury]
injury_single_hit = 110     ; How hard ONE hit must be to injure a player at once (without building up to 200).
                            ; Applies when the hit knocks him down in the opponent's half and a foul is given.
                            ; Konami 85: a slide from behind at high speed (~100-125) often goes over it.
                            ; 110 = only a really brutal hit injures. The build-up (150 risk / 200 injury)
                            ; is unchanged. Applies to both teams.

[ballcarrier]
attack_finish_angle = 85    ; When the AI BALL CARRIER switches to "finishing" mode: shoots / takes risks instead
                            ; of passing forward. He switches if he faces the goal at an angle smaller than this
                            ; number and has a free lane. Konami 100. Smaller = fewer rushed shots and dives,
                            ; more patient build-up.
