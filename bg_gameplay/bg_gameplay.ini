; bg_gameplay.ini -- настройки на bg_gameplay.dll (PES 2021, exe 1.01)
; Чете се при пускане на играта и наново преди всеки мач: промяната важи от следващия мач.
; Всяка стойност може да е konami (= както в играта, без промяна).
; Ако файлът липсва, DLL-ът го създава с тези стойности.

[defense]
def_pursuit_speed = 36      ; Скорост на преследване на защитниците на AI (най-бързото им ниво на движение).
                            ; Konami 28. При 6 защитата почти не те гони; при 36 натиска по целия терен.
profile = fair              ; Профил за надничането и реакцията на защитника: light, fair, strong или custom.
                            ; Профилите се редактират в секциите [profile_light] / [profile_fair] / [profile_strong].
                            ; При custom важат стойностите decide / foot / angle / press / react, написани тук.
; decide = 0.85
; foot = 0.85
; angle = 0.8
; press = 0.6
; react = 8

[profile_fair]
decide = 0.85               ; Решението дали и къде да отнеме / шпагат: каква част от твоето докосване (0..1)
                            ; трябва да е минала, преди защитникът да „прочете“ новата ти посока от стика.
                            ; 0 = ясновидец, 1 = вижда само реалната топка. Konami 0.7 (+ два случая без проверка).
foot = 0.85                 ; Същото за посоката на крака по време на отнемането. Konami почти винаги 0.
angle = 0.8                 ; Същото за ъгъла на тялото ти, по който AI избира отнемането (0..0.99). Konami 0.5.
press = 0.6                 ; Същото за посоката, в която пресата смята, че тръгваш. Konami 0.25.
react = 8                   ; На колко кадъра (54 в секунда) защитникът срещу теб (1 срещу 1 и задържане) решава
                            ; наново къде да застане. Konami 1-2; 8 = до 130 ms; човек ~200-250 ms (11-14).

[profile_light]
decide = 0.8
foot = 0.8
angle = 0.7
press = 0.4
react = 4

[profile_strong]
decide = 1
foot = 1
angle = 0.95
press = 0.9
react = 12

[press]
; Кой защитник на AI тръгва да НАТИСКА топконосителя. Важи само когато AI е на Professional или по-високо ниво.
; Разстоянията са в метри от защитника до топконосителя; по-голямо = натиска от по-далеч. Защитникът трябва да е
; между топконосителя и своята врата. Специалните случаи (гонене на резултат, Gegenpress, Tight Marking, дерби,
; атакуващ режим, Legend) остават както в играта – там натискът и без това е от по-далеч.
press_radius_normal = 9     ; ОСНОВНИЯТ радиус в обикновена игра. Защитникът тръгва на натиск, само ако е по-близо.
                            ; Konami 6. Главният регулатор за „натиск по целия терен“.
press_radius_far = 12       ; ДАЛЕЧНИЯТ радиус в обикновена игра – горна граница преди основния. Konami 10.
                            ; Трябва да е поне колкото press_radius_normal, иначе той реже основния.
                            ; В играта същото число е и добавката за бърз защитник на ниво Legend (+10 м).
sandwich_distance = 2.0     ; На колко метра от теб застава вторият защитник при сандвич (двоен натиск).
                            ; Konami 1.5. По-малко = по-плътно (повече сблъсъци); по-голямо = оставя място да излезеш.

[slides]
slide = fix                 ; fix = маха засилването на шпагатите, когато AI губи (+1 „гони резултата“ и +1
                            ; „атака ниво 4“ към агресията на шпагата). konami = засилването остава.
slidemax = 2                ; Таван на агресията на шпагата L (0..3). Konami 3. L решава от колко далеч
                            ; (4 + 0.8*L м), колко неточен ъгъл / момент и колко риск от сблъсък приема шпагатът;
                            ; при 3 пропуска проверката „друг противник наблизо“. Под 3 AI не влиза с шпагат в
                            ; своето наказателно поле.

[injury]
injury_single_hit = 110     ; Колко силен трябва да е ЕДИН удар, за да контузи играч веднага (без натрупване до 200).
                            ; Важи, когато ударът го събори в половината на противника и после се свири фал.
                            ; Konami 85: шпагат отзад на висока скорост (~100-125) често го надминава.
                            ; 110 = контузва само наистина брутален удар. Натрупването (150 риск / 200 контузия)
                            ; не се променя. Важи и за двата отбора.

[ballcarrier]
attack_finish_angle = 85    ; Кога ТОПКОНОСИТЕЛЯТ НА AI минава в режим „довършване“: стреля / рискува, вместо да
                            ; подава напред. Минава, ако гледа към вратата под ъгъл, по-малък от това число,
                            ; и има свободен коридор. Konami 100. По-малко = по-малко прибързани удари и симулации,
                            ; по-търпеливо изграждане.

[debug]
collision_log = 0           ; 1 = записва всеки сблъсък с щета в bg_gameplay_collisions.log (до DLL-а): време,
                            ; кой кого, действията и скоростите им, щета по формулата и записана щета, натрупана
                            ; щета, „кандидат за контузия“, чакащ фал. Само чете. 0 = изключен.

; Съдията е с фиксирани прагове (без настройка): фал извън полето 38, в полето 35, жълт 70, червен 105
; (Konami 40 / 60 / 80 / 110).
